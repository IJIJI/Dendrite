# The vitest suites, via the root fan-out script: packages/*/src/**/*.test.ts, plus the docs'
# own suite over every sample the site shows.
name: Test

# PR-only - see lint.yml: a PR surfaces the same runs, so both triggers would double them.
#
# Deliberately unfiltered by path, unlike the other gates: the docs suite reads the pages
# themselves - every Dendrite and TypeScript sample in them - so a Markdown-only change is
# exactly what it exists to catch.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test
