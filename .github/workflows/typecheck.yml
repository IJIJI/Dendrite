# tsc --noEmit in every workspace, via the root fan-out script (core: src + examples;
# playground: its sources + Vite config, against the language source it aliases in).
name: Typecheck

# Push-only - see lint.yml.
on:
  push:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck
