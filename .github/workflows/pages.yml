# Build the docs and the playground and deploy them to GitHub Pages as one site.
#
# Site layout: the docs (apps/docs) at the root, the playground (apps/playground) under
# /playground/, where share links (the document in the #fragment) point.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung build must not hold the pages concurrency slot
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Both apps bundle the language and editor SOURCE via their Vite aliases. The docs'
      # Astro config is the exception: it loads before those aliases exist and imports the
      # editor's published entry (the remark plugin highlights through it), so the editor
      # is built first. Each app takes its deployed base path from the environment.
      - name: Build playground
        run: yarn workspace dendrite-playground run build
        env:
          PLAYGROUND_BASE: /Dendrite/playground/

      - name: Build the editor (the docs' config imports it)
        run: yarn workspace @dendrite-lang/editor run build

      - name: Build docs
        run: yarn workspace dendrite-docs run build
        env:
          DOCS_BASE: /Dendrite/
          PUBLIC_PLAYGROUND_URL: /Dendrite/playground/

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/docs/dist/. site/
          cp -r apps/playground/dist site/playground

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
