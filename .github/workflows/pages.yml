# Build the docs and the playground and deploy them to GitHub Pages as one site.
#
# Site layout: the docs (apps/docs) at the root, the playground (apps/playground) under
# /playground/, where share links (the document in the #fragment) point.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung build must not hold the pages concurrency slot
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Where Pages serves this site: its origin, and the path under it. A project site lives
      # under /<repo>/ and a custom domain at the root, and only Pages knows which this is.
      # Nothing below names an address, so a change of domain in the repository's settings
      # needs no change here: run this workflow again and the build follows. (The paths were
      # written out as /Dendrite/ until 2026-10-08, when a custom domain moved the site to
      # the root and every file the pages asked for became a 404.)
      - id: pages
        uses: actions/configure-pages@v5

      # Both apps bundle the language and editor SOURCE via their Vite aliases. The docs'
      # Astro config is the exception: it loads before those aliases exist and imports the
      # editor's published entry (the remark plugin highlights through it), so the editor
      # is built first. Each app takes its deployed base path from the environment.
      - name: Build playground
        run: yarn workspace dendrite-playground run build
        env:
          PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/playground/

      # The editor's published entry imports the core's, so both are built, in order.
      - name: Build the packages (the docs' config imports the editor)
        run: yarn workspace @dendrite-lang/core run build && yarn workspace @dendrite-lang/editor run build

      - name: Build docs
        run: yarn workspace dendrite-docs run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_PLAYGROUND_URL: ${{ steps.pages.outputs.base_path }}/playground/

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/docs/dist/. site/
          cp -r apps/playground/dist site/playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A site built for one base path and served at another still answers 200 for its HTML,
      # while every file that HTML asks for is a 404. So the page that was just deployed has
      # to find its own stylesheet, or this run fails where someone will see it.
      - name: The deployed page finds its stylesheet
        shell: bash
        run: |
          page="${{ steps.deployment.outputs.page_url }}"
          origin="$(echo "$page" | sed -E 's#^(https?://[^/]+).*#\1#')"
          css="$(curl -fsSL --retry 5 --retry-delay 5 "$page" | grep -o 'href="[^"]*\.css"' | head -n 1 | cut -d '"' -f 2)"
          test -n "$css"
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$origin$css"
