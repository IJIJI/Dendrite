# Every workspace's build, via the root fan-out script: core's tsup bundle (cjs+esm AND the
# .d.ts rollup - the dts step type-checks the PUBLIC surface, which plain `tsc --noEmit`
# does not exercise the same way, and it has broken on toolchain bumps before) and the
# playground's Vite production build (bundling, asset resolution, the Vite config).
name: Build

# Push-only - see lint.yml.
on:
  push:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build
