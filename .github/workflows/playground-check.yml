# Playground CI: typecheck + production build on every change that can affect it.
#
# Deliberately SELF-CONTAINED (it repeats the setup steps instead of using
# .github/actions/setup): the playground is a standalone nested project that will move
# to its own repo, and this file should travel with it unchanged.
name: Playground

# Push-only, on every branch: a PR surfaces these same runs (checks attach to the commit
# SHA, not the event), so a `pull_request` trigger would only double them.
on:
  push:
    paths:
      - "playground/**"
      - "src/**"
      - ".github/workflows/playground-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # Its own project root: own lockfile, own node_modules linker.
        working-directory: playground
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4 via packageManager field)
        run: corepack enable

      # Yarn 4 caches globally (~/.yarn/berry/cache), so ask it for the real path.
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-playground-${{ runner.os }}-${{ hashFiles('playground/yarn.lock') }}
          restore-keys: yarn-playground-${{ runner.os }}-

      - run: yarn install --immutable

      # Covers the playground's own sources AND the language source it aliases in.
      - run: yarn typecheck

      # Catches what typecheck cannot: bundling, asset resolution, the Vite config.
      - run: yarn build
