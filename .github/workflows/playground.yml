# Build the playground and deploy it to GitHub Pages.
#
# The playground consumes the language SOURCE (../src via its Vite alias), so no root
# install/build is needed - only the playground's own dependencies. One-time repo setup:
# Settings → Pages → Source = "GitHub Actions".
name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "src/**"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4 via packageManager field)
        run: corepack enable

      # Yarn 4 caches globally (~/.yarn/berry/cache), so ask it for the real path.
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: playground
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-playground-${{ runner.os }}-${{ hashFiles('playground/yarn.lock') }}
          restore-keys: yarn-playground-${{ runner.os }}-

      - name: Install playground dependencies
        working-directory: playground
        run: yarn install --immutable

      - name: Build playground
        working-directory: playground
        run: yarn build
        env:
          PLAYGROUND_BASE: /Dendrite/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
