# Build the playground and deploy it to GitHub Pages.
#
# Site layout: the root is a hash-forwarding redirect (.github/pages/index.html) and the
# playground lives under /playground/, so the docs site can take the root later without
# breaking share links (which encode the whole document in the #fragment).
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "packages/core/**"
      - ".github/pages/**"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The playground bundles the language SOURCE via its Vite alias - no core build needed.
      - name: Build playground
        run: yarn workspace dendrite-playground run build
        env:
          PLAYGROUND_BASE: /Dendrite/playground/

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/playground/dist site/playground
          cp .github/pages/index.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
