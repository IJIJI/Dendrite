# Shared preamble for every workflow: Node + Yarn 4 + a warm cache + an immutable install
# of the whole workspace (the one root lockfile covers every package and app).
name: Setup
description: Node 22 and Yarn 4 (via corepack) with a warm cache, then an immutable workspace install.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # Yarn 4 comes from package.json's packageManager field.
    # Must run AFTER setup-node so the shims land on the selected Node's PATH.
    - name: Enable corepack
      shell: bash
      run: corepack enable

    # Yarn 4 defaults to a GLOBAL cache (~/.yarn/berry/cache) and this repo has no
    # zero-install .yarn/cache, so ask Yarn where its cache actually lives instead of
    # guessing a path that would silently never hit.
    - name: Locate the Yarn cache
      id: yarn-cache
      shell: bash
      run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.path }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        # Partial hit: one dependency bump still reuses every other package already
        # downloaded, instead of falling back to a cold install.
        restore-keys: yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
