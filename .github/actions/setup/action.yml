# Shared preamble for the core (root project) workflows: Node + Yarn 4 + a warm cache
# + an immutable install. One place to fix, four workflows fixed.
#
# The playground workflows do not use this.
name: Setup
description: Node 22 and Yarn 4 (via corepack) with a warm cache, then an immutable install.

inputs:
  working-directory:
    description: Project root to install in - nested projects carry their own lockfile.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # Yarn 4 comes from package.json's packageManager field.
    # Must run AFTER setup-node so the shims land on the selected Node's PATH.
    - name: Enable corepack
      shell: bash
      run: corepack enable

    # Yarn 4 defaults to a GLOBAL cache (~/.yarn/berry/cache) and this repo has no
    # zero-install .yarn/cache, so ask Yarn where its cache actually lives instead of
    # guessing a path that would silently never hit.
    - name: Locate the Yarn cache
      id: yarn-cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.path }}
        key: yarn-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        # Partial hit: one dependency bump still reuses every other package already
        # downloaded, instead of falling back to a cold install.
        restore-keys: yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --immutable
